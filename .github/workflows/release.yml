name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/Glassy.Tests -c Release

      - name: Publish (framework-dependent, no console host)
        run: >
          dotnet publish src/Glassy.App/Glassy.App.csproj -c Release -r win-x64
          --no-self-contained -p:UseAppHost=false -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath GlassySystemGadget-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: GlassySystemGadget-win-x64.zip
          generate_release_notes: true
